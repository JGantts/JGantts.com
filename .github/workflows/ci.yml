name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - prod
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            jgantts-com/package-lock.json
            jgantts-server/package-lock.json

      - name: Install and build website
        run: |
          npm ci
          npm run build
        working-directory: ./jgantts-com

      - name: Install server dependencies
        run: npm ci
        working-directory: ./jgantts-server

      - name: Type-check and test server
        run: npm run check
        working-directory: ./jgantts-server

      - name: Build server
        run: npm run build
        working-directory: ./jgantts-server

      - name: Smoke-test compiled server
        run: npm run smoke:local
        working-directory: ./jgantts-server

      - name: Test deployment tooling
        run: |
          set -euo pipefail
          node --check scripts/package-release.js
          node scripts/test-package-release.js
          bash -n deploy/*.sh
          shellcheck deploy/*.sh
          deploy/test-installer.sh
          deploy/test-activation.sh
          deploy/test-recovery.sh
          systemd-analyze verify deploy/systemd/jgantts-com-node-app.service
