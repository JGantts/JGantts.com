name: Deploy to Linode

permissions:
  contents: read

on:
  push:
    branches:
      - prod

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      maps_python: ${{ steps.filter.outputs.maps_python }}
      maps_sources: ${{ steps.filter.outputs.maps_sources }}
      website: ${{ steps.filter.outputs.website }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            maps_python:
              - 'python/**'
            maps_sources:
              - 'maps-sources/**'
            website:
              - 'jgantts-com/**'
              - 'jgantts-server/**'
              - '.github/workflows/deploy.yml'

  deploy-maps:
    needs: changes
    if: |
      needs.changes.outputs.maps_python == 'true' ||
      needs.changes.outputs.maps_sources == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PMTiles CLI
        run: |
          mkdir -p $HOME/.local/bin
          curl -fL https://github.com/protomaps/go-pmtiles/releases/download/v1.30.2/go-pmtiles_1.30.2_Linux_x86_64.tar.gz -o pmtiles.tar.gz
          tar -xzf pmtiles.tar.gz
          chmod +x pmtiles
          mv pmtiles $HOME/.local/bin/pmtiles
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify tools
        run: |
          gdalwarp --version
          gdal2tiles.py --help
          pmtiles --help

      - name: Install Python dependencies
        run: |
          python3 -m venv ./venv
          source ./venv/bin/activate
          python3 -m pip install -r requirements.txt
        working-directory: ./python/

      - name: Build map
        run: |
          python3 -m venv ./venv
          source ./venv/bin/activate
          python3 make_all_tiles.py
        working-directory: ./python/

      - name: Deploy Map
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.LINODE_IP }}
          username: ${{ secrets.LINODE_USER }}
          password: ${{ secrets.LINODE_PASSWORD }}
          port: 22
          source: './maps-rendered/'
          target: '/home/jgantts-com/node-js/jgantts-com/PUBLIC/assets/maps/'
          strip_components: 2
          rm: true

  deploy-build-info:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate centralized build information
        run: node scripts/write-build-info.js
        working-directory: ./jgantts-server

      - name: Deploy centralized build information
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.LINODE_IP }}
          username: ${{ secrets.LINODE_USER }}
          password: ${{ secrets.LINODE_PASSWORD }}
          port: 22
          source: './jgantts-server/dist/build-info.json'
          target: '/home/jgantts-com/node-js/'

  deploy-site:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            jgantts-com/package-lock.json
            jgantts-server/package-lock.json

      - name: Build website
        run: |
          npm ci
          npm run build
        working-directory: ./jgantts-com/

      - name: Verify and build server
        run: |
          npm ci
          npm run check
          npm run build
        working-directory: ./jgantts-server/

      - name: Back up production content
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.LINODE_IP }}
          username: ${{ secrets.LINODE_USER }}
          password: ${{ secrets.LINODE_PASSWORD }}
          port: 22
          script: |
            set -eu
            backup_root=/var/backups/jgantts-com/pre-deploy
            backup_name="$(date -u +%Y%m%dT%H%M%SZ)-${{ github.sha }}"
            backup_path="$backup_root/$backup_name"
            server_root=/home/jgantts-com/node-js/jgantts-server

            sudo install -d -o jgantts-com -g jgantts-com -m 0750 "$backup_root"
            cd "$server_root"
            sudo -u jgantts-com env \
              NODE_ENV=production \
              JGANTTS_DATA_ROOT=/var/lib/jgantts \
              node dist/cli/backup-content.js "$backup_path"
            sudo -u jgantts-com node -e 'const Database = require("better-sqlite3"); const database = new Database(process.argv[1], { readonly: true }); const result = database.pragma("integrity_check", { simple: true }); database.close(); if (result !== "ok") throw new Error(`SQLite integrity check failed: ${result}`);' "$backup_path/content.sqlite"
            sudo -u jgantts-com test -d "$backup_path/media/originals"
            sudo -u jgantts-com test -d "$backup_path/media/derived"
            sudo -u jgantts-com ln -sfn "$backup_path" "$backup_root/latest"
            echo "Verified pre-deploy backup: $backup_path"

      - name: Deploy JGantts Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.LINODE_IP }}
          username: ${{ secrets.LINODE_USER }}
          password: ${{ secrets.LINODE_PASSWORD }}
          port: 22
          source: './jgantts-server/dist,./jgantts-server/serve.js,./jgantts-server/package.json,./jgantts-server/package-lock.json,./jgantts-com/dist,./jgantts-com/PUBLIC'
          target: '/home/jgantts-com/node-js/'

      - name: Restart JGantts Server
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.LINODE_IP }}
          username: ${{ secrets.LINODE_USER }}
          password: ${{ secrets.LINODE_PASSWORD }}
          port: 22
          script: |
            whoami
            cd /home/jgantts-com/node-js/jgantts-server
            npm ci --omit=dev
            sudo systemctl restart jgantts-com-node-app


  verify-build-info:
    needs:
      - deploy-build-info
      - deploy-site
    if: |
      always() &&
      needs.deploy-build-info.result == 'success' &&
      (needs.deploy-site.result == 'success' || needs.deploy-site.result == 'skipped')
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify live server and deployed commit
        run: node scripts/smoke-test.js --live
        working-directory: ./jgantts-server
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
